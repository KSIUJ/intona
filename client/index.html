<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Vercel</title>

    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vercel działa! 🚀</h1>
        <p>Jeśli widzisz ten ekran, Twoje repozytorium jest poprawnie podpięte.</p>
        <button id="start">Start</button>
        current most probable bin: <span id="currentResult"></span>
    </div>

    <script>
        document.getElementById('start').addEventListener("click", async () => {
    const socket = new WebSocket("wss://intona-production.up.railway.app/api/vocal_analysis/audio-data");

    const stream = await navigator.mediaDevices.getUserMedia({ audio: {
        sampleRate: 16000,
        channelCount: 1,
            echoCancellation: true,
            autoGainControl: false,
            noiseSuppression: true
    } });

    let audioContext = new AudioContext({sampleRate: 16000});
    await audioContext.audioWorklet.addModule("realtime_audio_processor.js")
    const source = audioContext.createMediaStreamSource(stream);
    const workletNode = new AudioWorkletNode(audioContext, "RealTimeAudioProcessor")
    const gainNode = audioContext.createGain();

    gainNode.gain.value = 20;
    source.connect(gainNode);
    gainNode.connect(workletNode);
    gainNode.connect(audioContext.destination);

    let chunksCount = 0;
    let bytesCount = 0;

    workletNode.port.onmessage = (event) => {
        const audioChunk = event.data;
        if (socket.readyState === WebSocket.OPEN) {
            socket.send(audioChunk.slice());

            chunksCount++;
            bytesCount += audioChunk.byteLength;
        }
    };

    setInterval(() => {
        if (chunksCount > 0) {
            const kbPerSecond = (bytesCount / 1024).toFixed(2);
            console.log(`Prędkość: ${chunksCount} paczek/sekundę | Transfer: ${kbPerSecond} KB/s`);

            chunksCount = 0;
            bytesCount = 0;
        }
    }, 1000);

    socket.addEventListener("message", (event) => {
        console.log("Serwer odpowiada:", event.data);
        document.getElementById("currentResult").innerHTML="<b>" + event.data + "</b>";
    });
});

    </script>
</body>
</html>
